# kafkaClientVersion and redissonVersion MUST match the versions used by the messaging
# libraries that the CDC service embeds:
#   kafkaClientVersion -> kafkaClientVersion in eventuate-messaging-kafka/gradle.properties
#   redissonVersion    -> redissonVersion in eventuate-messaging-redis/gradle.properties
# The CDC service runs classes compiled against those versions, so a mismatch risks binary
# incompatibility. They are applied as strict constraints in build.gradle to override the
# newer versions managed by the Spring Boot BOM.
