apply plugin: 'java-library'

dependencies {
    api project(":eventuate-local-java-cdc-connector-mysql-binlog")
    api project(":eventuate-local-java-cdc-connector-polling")
    api project(":eventuate-local-java-cdc-connector-postgres-wal")
    api "io.eventuate.common.eventuate.local:eventuate-common-eventuate-local:$eventuateCommonEventuateLocalVersion"
    api "io.eventuate.common.zookeeper:eventuate-common-coordination-leadership-zookeeper:$eventuateCommonZookeeperVersion"

    api "com.zaxxer:HikariCP:$hikariCpVersion"
    testImplementation "com.h2database:h2:$h2Version"
    testImplementation "org.springframework.boot:spring-boot-starter-jdbc-test:$springBootVersion"
}

test {
    forkEvery 1
    useJUnitPlatform()
}
