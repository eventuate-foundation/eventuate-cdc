dependencies {
    implementation "io.eventuate.common.testcontainers:eventuate-common-testcontainers:$eventuateCommonTestcontainersVersion"
    implementation "io.eventuate.messaging.kafka:eventuate-messaging-kafka-testcontainers:$eventuateMessagingKafkaVersion"
    implementation "org.springframework.boot:spring-boot-starter-jdbc-test:$springBootVersion"

    api "org.testcontainers:testcontainers-kafka:$testContainersVersion"
    implementation "org.assertj:assertj-core:$assertjVersion"

    api "io.eventuate.common.database:eventuate-common-database-testcontainers:$eventuateCommonDatabaseVersion"

    testImplementation "io.eventuate.common.database:eventuate-common-flyway:$eventuateCommonDatabaseVersion"
    testImplementation "org.springframework.boot:spring-boot-starter-flyway:$springBootVersion"
    testImplementation "org.springframework.boot:spring-boot-starter-flyway-test:$springBootVersion"
    testRuntimeOnly "org.flywaydb:flyway-mysql:$flywayVersion"
    testRuntimeOnly "org.flywaydb:flyway-database-postgresql:$flywayVersion"
    testRuntimeOnly "org.flywaydb:flyway-sqlserver:$flywayVersion"



}

task writeProperties(type: WriteProperties) {
    outputFile "${project.buildDir}/generated/eventuate.cdc.version.properties"
    property 'version', version
}

test.dependsOn(":eventuate-cdc-service:assemble")

processResources.from(writeProperties)
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}