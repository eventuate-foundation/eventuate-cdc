
apply plugin: 'org.springframework.boot'

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-actuator:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-micrometer-metrics:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-webmvc:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-data-redis:$springBootVersion"
    implementation project(":eventuate-cdc-connector-autoconfigure")

    implementation "io.micrometer:micrometer-registry-jmx:$micrometerVersion"
    implementation "io.micrometer:micrometer-registry-prometheus:$micrometerVersion"

    implementation ("org.postgresql:postgresql:$postgresqlVersion") {
        exclude group: "org.slf4j", module: "slf4j-simple"
    }
}

configurations {
    [apiElements, runtimeElements].each {
        it.outgoing.artifacts.removeIf {
            it.buildDependencies.getDependencies(null).contains(jar)
        }
        it.outgoing.artifact(bootJar)
    }
}

publish.dependsOn(tasks.findByName('bootRepackage') == null ? tasks['bootJar'] : tasks['bootRepackage'])
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
